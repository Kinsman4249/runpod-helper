# presets.conf - maps MODEL_PRESET values to a Hugging Face GGUF repo/file
# and llama-server flags. Sourced by entrypoint.sh (not run directly), which
# expects this to set HF_REPO, HF_FILE, and LLAMA_EXTRA_ARGS for whatever
# $MODEL_PRESET the pod was launched with.
#
# Quant choice: both presets default to Unsloth's "UD" (Unsloth Dynamic)
# Q4_K_XL quant - matches the 4-bit/~17-20GB row in PREREQUISITES.md's
# sizing table. Filenames confirmed to exist via the HF API
# (huggingface.co/api/models/<repo>) as of 2026-07-30; if unsloth renames or
# re-quantizes, this will 404 at boot and need updating.

case "$MODEL_PRESET" in
  qwen36-27b)
    HF_REPO="unsloth/Qwen3.6-27B-MTP-GGUF"
    HF_FILE="Qwen3.6-27B-UD-Q4_K_XL.gguf"
    # Dense model with a built-in MTP (multi-token prediction) draft head -
    # --spec-type draft-mtp turns on self-speculative decoding using it.
    # Flag name confirmed current against ggml-org/llama.cpp's
    # tools/server/README.md (2026-07-30) - this replaced an older
    # "--spec-type mtp" name that llama-server now silently ignores instead
    # of erroring on, so don't let this drift without re-checking.
    LLAMA_EXTRA_ARGS=(-ngl 999 --ctx-size 32768 --spec-type draft-mtp --spec-draft-n-max 3)
    ;;
  qwen3-coder-next)
    HF_REPO="unsloth/Qwen3-Coder-Next-GGUF"
    HF_FILE="Qwen3-Coder-Next-UD-Q4_K_XL.gguf"
    # MoE (~30B total/~3B active) - no MTP head shipped for this one, and
    # per this repo's README we're not assuming speculative decoding helps
    # here, so no --spec-type flag.
    LLAMA_EXTRA_ARGS=(-ngl 999 --ctx-size 65536)
    ;;
  *)
    echo "Unknown MODEL_PRESET '$MODEL_PRESET' - add it to image/presets.conf" >&2
    exit 1
    ;;
esac
