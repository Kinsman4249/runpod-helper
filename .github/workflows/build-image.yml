# Builds image/Dockerfile (the paired OpenHands + llama.cpp pod image) and
# pushes it to GHCR whenever image/** changes on main, or on demand. No GPU
# runner needed: the base image already ships a compiled CUDA llama-server,
# this only layers apt/pip installs on top of it.
#
# Tags left unpinned deliberately, matching this repo's release.yml -
# see the directive comment there before adding SHA pinning.
name: Build pod image

on:
  push:
    branches: [main]
    paths:
      - 'image/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # GHCR repo names must be lowercase; github.repository_owner preserves
  # the account's display case (Kinsman4249), so lowercase it explicitly.
  IMAGE_NAME: ghcr.io/${{ toLower(github.repository_owner) }}/runpod-helper-image

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
